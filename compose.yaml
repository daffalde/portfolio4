services:
  backend:
    container_name: golang
    env_file:
      - ./backend/.env
    depends_on:
      - db
    build:
      context: ./backend
      target: final
    ports:
      - 8080:8080
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
